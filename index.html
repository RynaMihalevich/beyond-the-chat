<title>Beyond the Chat v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Outfit:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
/* FoundersHub AI deck style. Stage 1920×1080 scaled to the window.
   Palette and type from foundershubriga.ai: void blacks, electric mint, violet, hack red; Sora / Outfit / JetBrains Mono.
   Dark-first like the site; T switches to the projector-light set. */
:root{
  --bg:#050508; --paper:#0C0D10; --card:#14161C; --card2:#101217; --line:#1E2028; --line2:#2A2D38;
  --ink:#F1F5F9; --muted:#94A3B8; --faint:#64748B;
  --mint:#00FFAA; --mint-soft:#062A20; --mint-glow:rgba(0,255,170,.28);
  --violet:#A78BFA; --violet-soft:#1C1533;
  --danger:#FF0033; --danger-soft:#2A0710; --on-danger:#FFFFFF;
  --amber:#FBBF24;
  --spot:rgba(0,255,170,.10);
  --f-display:"Sora","Sora Variable",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Outfit","Outfit Variable",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E6EAEF;--paper:#F8FAFC;--card:#FFFFFF;--card2:#F1F4F8;--line:#D3D9E1;--line2:#C3CBD6;
    --ink:#0C0D10;--muted:#475569;--faint:#64748B;
    --mint:#00A870;--mint-soft:#D9FBEF;--mint-glow:rgba(0,168,112,.18);
    --violet:#6D28D9;--violet-soft:#EDE7FD;--danger:#E0002D;--danger-soft:#FDE3E8;--amber:#B7791F;
    --spot:rgba(0,168,112,.08);color-scheme:light}
}
:root[data-theme="light"]{
    --bg:#E6EAEF;--paper:#F8FAFC;--card:#FFFFFF;--card2:#F1F4F8;--line:#D3D9E1;--line2:#C3CBD6;
    --ink:#0C0D10;--muted:#475569;--faint:#64748B;
    --mint:#00A870;--mint-soft:#D9FBEF;--mint-glow:rgba(0,168,112,.18);
    --violet:#6D28D9;--violet-soft:#EDE7FD;--danger:#E0002D;--danger-soft:#FDE3E8;--amber:#B7791F;
    --spot:rgba(0,168,112,.08);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(1100px 520px at 50% -80px,var(--spot),transparent 70%),var(--paper)}

/* global top bar */
.bar{position:absolute;left:96px;right:96px;top:36px;height:64px;display:flex;justify-content:space-between;align-items:center;z-index:5;
  font-family:var(--f-mono);font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bar .brand{display:flex;align-items:center;gap:16px}
.bar .brand b{color:var(--ink)}
.bar img{width:52px;height:52px;border-radius:50%;background:#000}
.bar .right{display:flex;align-items:center;gap:22px;font-variant-numeric:tabular-nums}
.lvl{padding:6px 12px;border:1px solid currentColor;border-radius:2px;font-size:18px}
.lvl.start{color:var(--mint)} .lvl.deep{color:var(--violet)} .lvl.none{display:none}
.fsbtn{position:absolute;right:96px;top:120px;z-index:6;font:700 18px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  padding:12px 16px;border:1px solid var(--mint);color:var(--mint);background:transparent;border-radius:2px;cursor:pointer}
:fullscreen .fsbtn{display:none}

/* slides */
.slide{position:absolute;inset:0;visibility:hidden}
.slide.is-on{visibility:visible}
.in{position:absolute;left:96px;right:96px;top:132px;bottom:64px;display:flex;flex-direction:column;gap:34px}
.note{display:none}
.eyebrow{font-family:var(--f-mono);font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mint)}
.eyebrow span{color:var(--violet)}
.head{margin:0;font-family:var(--f-display);font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
.head.xl{font-size:200px;line-height:.95}
.head.l{font-size:132px}
.head em{font-style:normal;color:var(--mint)}
.head .r{color:var(--danger)}
.ln{display:block;overflow:hidden;padding-bottom:6px}
.ln>span{display:inline-block}
.lede{font-size:40px;line-height:1.3;font-weight:500;color:var(--muted);max-width:1500px;margin:0}
.lede b{color:var(--ink);font-weight:700}
.cap{margin-top:auto;font-size:38px;font-weight:500;line-height:1.3;margin-bottom:0}
.cap b{color:var(--mint);font-weight:700}
.src{font-family:var(--f-mono);font-size:20px;color:var(--faint);letter-spacing:.02em}
.mint{color:var(--mint)} .violet{color:var(--violet)} .red{color:var(--danger)} .muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.grow{flex:1;min-height:0}

.row{display:flex;gap:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:30px 34px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h3{margin:0;font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.card p{margin:0;font-size:30px;line-height:1.3;color:var(--muted)}
.card p b{color:var(--ink)}
.card .lab{font-family:var(--f-mono);font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.tight .card{padding:22px 28px;gap:8px}.tight .card h3{font-size:34px}.tight .card p{font-size:27px}
.chips-l .chip{font-size:30px;padding:10px 16px}
.card.hot{background:var(--mint-soft);border-color:var(--mint);box-shadow:0 0 48px -8px var(--mint-glow)}
.card.hot h3{color:var(--mint)}
.card.bad{background:var(--danger-soft);border-color:var(--danger)}
.card.bad h3{color:var(--danger)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:23px;padding:7px 13px;border-radius:4px;border:1px solid var(--line2);background:var(--card2);color:var(--ink)}
.code{font-family:var(--f-mono);font-size:25px;line-height:1.45;background:var(--card2);border:2px solid var(--line);border-radius:8px;padding:26px 30px;white-space:pre;color:var(--ink);margin:0;overflow:hidden}
.code .c{color:var(--faint)} .code .k{color:var(--violet)} .code .s{color:var(--mint)} .code .x{color:var(--danger)}
.sticker{display:inline-block;padding:12px 22px;border-radius:4px;background:var(--danger);color:var(--on-danger);
  font-family:var(--f-display);font-size:30px;font-weight:800;text-transform:uppercase;transform:rotate(-3deg)}
.sticker.ok{background:var(--mint);color:#04110C}

/* tables */
.tbl{display:grid;border-top:2px solid var(--line)}
.tbl>div{display:contents}
.tbl>div>span{padding:16px 18px;border-bottom:2px solid var(--line);font-size:28px;line-height:1.25}
.tbl .th>span{font-family:var(--f-mono);font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);padding-top:14px;padding-bottom:14px}
.tbl span.n{font-family:var(--f-display);font-weight:800;color:var(--ink)}

/* poll */
.poll{display:grid;grid-template-columns:1fr 420px;gap:64px;align-items:center}
.opts{display:flex;flex-direction:column;gap:18px}
.opt{display:flex;align-items:center;gap:24px;font-size:40px;font-weight:500}
.opt i{font-style:normal;font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--mint);width:46px;height:46px;border:2px solid var(--mint);border-radius:2px;display:grid;place-items:center;flex:none}
.qr{width:420px;display:flex;flex-direction:column;gap:16px;align-items:center}
.qr .code-svg{width:380px;height:380px;background:#fff;padding:20px;border-radius:6px;box-sizing:content-box}
.qr .code-svg svg{width:100%;height:100%;display:block}
.qr .url{font-family:var(--f-mono);font-size:24px;color:var(--muted);text-align:center;word-break:break-all}
.pending{width:380px;height:380px;border:3px dashed var(--danger);border-radius:6px;display:grid;place-items:center;text-align:center;
  font-family:var(--f-mono);font-size:24px;font-weight:700;color:var(--danger);letter-spacing:.08em;text-transform:uppercase;padding:20px;box-sizing:border-box}
.results{flex:1;min-height:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;position:relative;background:var(--card)}
.results iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.results .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.btn{font:700 30px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:24px 34px;border:2px solid var(--mint);color:var(--mint);
  background:transparent;border-radius:2px;text-decoration:none;cursor:pointer}

/* act dividers */
.act .in{justify-content:center;gap:20px}
.act .num{font-family:var(--f-display);font-weight:800;font-size:300px;line-height:.85;color:transparent;-webkit-text-stroke:3px var(--mint)}
.act .head{font-size:180px}

/* map nodes */
.mapwrap{position:relative;flex:1}
.node{position:absolute;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:22px 26px;box-sizing:border-box}
.node:hover,.node.on{border-color:var(--mint);box-shadow:0 0 40px -8px var(--mint-glow)}
.node:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.node .t{font-family:var(--f-mono);font-size:28px;font-weight:700;color:var(--ink)}
.node .d{font-size:24px;color:var(--muted);margin-top:6px}
.pop{position:absolute;z-index:4;width:900px;background:var(--card);border:2px solid var(--mint);border-radius:8px;padding:30px 34px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);display:none}
.pop.on{display:block}
.slide:has(.pop.on) .cap{visibility:hidden}
.pop h4{margin:0 0 12px;font-family:var(--f-mono);font-size:30px;color:var(--mint)}
.pop p{margin:0;font-size:29px;line-height:1.35;color:var(--ink)}
.pop .who{margin-top:14px;font-family:var(--f-mono);font-size:21px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase}

/* svg wires */
svg.wires{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--violet);stroke-width:5;stroke-linecap:round}
.wire.danger{stroke:var(--danger);stroke-dasharray:14 12}
.wire.mint{stroke:var(--mint)}
.tip{fill:var(--violet)} .tip.danger{fill:var(--danger)} .tip.mint{fill:var(--mint)}
.packet{fill:var(--mint)}
.wlabel{font-family:var(--f-mono);font-size:24px;font-weight:500;fill:var(--muted)}
.wlabel.red{fill:var(--danger);font-weight:700}

/* strike for fillers */
.strike{position:relative;display:inline-block}
.strike::after{content:"";position:absolute;left:-4px;right:-4px;top:54%;height:4px;background:var(--danger);transform-origin:0 50%;transform:scaleX(var(--s,1))}

/* transition shutters */
#shutter{position:absolute;inset:0;pointer-events:none;z-index:20}
#shutter i{position:absolute;display:block;transform:scaleX(0)}
#shutter.h i{left:0;right:0;height:34%;transform-origin:0 50%}
#shutter.h i:nth-child(1){top:0;background:var(--mint)} #shutter.h i:nth-child(2){top:33%;background:var(--violet)} #shutter.h i:nth-child(3){top:66%;background:var(--card)}
#shutter.v i{top:0;bottom:0;width:34%;transform-origin:50% 0;transform:scaleY(0)}
#shutter.v i:nth-child(1){left:0;background:var(--mint)} #shutter.v i:nth-child(2){left:33%;background:var(--violet)} #shutter.v i:nth-child(3){left:66%;background:var(--card)}
#iris{position:absolute;left:50%;top:50%;width:2300px;height:2300px;margin:-1150px 0 0 -1150px;border-radius:50%;background:var(--mint);transform:scale(0);z-index:21;pointer-events:none}

/* notes */
#notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:50;background:rgba(5,5,8,.94);color:#F1F5F9;border:1px solid #2A2D38;border-radius:8px;
  padding:16px 20px;font:500 17px/1.45 var(--f-body);max-height:40vh;overflow:auto}
#notes b{color:#00FFAA;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
#jump{position:fixed;right:16px;top:16px;z-index:50;background:#0C0D10;color:#00FFAA;border:1px solid #00FFAA;font:700 18px var(--f-mono);padding:8px 12px;border-radius:2px}

/* print mode: every slide stacked at its final frame */
body.print{overflow:visible;height:auto}
body.print #deck{position:static;display:block}
body.print .stage{position:relative;transform:none!important;margin:0}
body.print .slide{visibility:visible}
body.print #shutter,body.print #iris,body.print .fsbtn{display:none}
@media (prefers-reduced-motion: reduce){ #shutter,#iris{display:none} }
</style>

<section class="slide" data-tr="wipe" data-act="Act 01 · Quality" data-level="start">
  <div class="in">
        <h2 class="head"><span class="ln"><span>Seven habits of <em>average text</em></span></span></h2>
    <div class="tbl grow" style="grid-template-columns:420px 1fr;align-content:start">
      <div class="th"><span>Habit</span><span>Sounds like</span></div>
      <div data-a="fade"><span class="n">Stock opener</span><span><span class="strike" data-a="strike">"In today's fast-paced world…"</span></span></div>
      <div data-a="fade"><span class="n">Contrast frame</span><span><span class="strike" data-a="strike">"It's not just a tool, it's a revolution"</span></span></div>
      <div data-a="fade"><span class="n">Reflex threes</span><span><span class="strike" data-a="strike">"faster, smarter, better"</span></span></div>
      <div data-a="fade"><span class="n">Hedging</span><span><span class="strike" data-a="strike">"It's worth noting that…"</span></span></div>
      <div data-a="fade"><span class="n">Empty summary</span><span><span class="strike" data-a="strike">"In conclusion, AI is transforming work"</span></span></div>
      <div data-a="fade"><span class="n">Dash habit</span><span><span class="strike" data-a="strike">"AI — the future — is here"</span></span></div>
      <div data-a="fade"><span class="n">Pet words</span><span><span class="strike" data-a="strike">delve · leverage · unlock · seamless</span></span></div>
    </div>
  </div>
  <aside class="note">These patterns go straight into a "banned phrases" list inside your voice skill, two slides on.</aside>
</section>

<section class="slide" data-tr="drop" data-act="Act 01 · Quality" data-level="start">
  <div class="in">
    <div class="eyebrow" data-a="fade">Same message, rewritten</div>
    <h2 class="head"><span class="ln"><span>Cut the filler, <em>keep the fact</em></span></span></h2>
    <div class="grid2 grow">
      <div class="card bad" data-a="left"><div class="lab">Before</div>
        <p style="font-size:38px;line-height:1.35;color:var(--ink)">In today's fast-paced world, AI isn't just a tool — it's a game-changer. Let's delve into how teams can unlock its full potential.</p></div>
      <div class="card hot" data-a="right"><div class="lab">After</div>
        <p style="font-size:38px;line-height:1.35;color:var(--ink)">Bring one prompt you use every week. Tonight we turn it into a skill your whole team can run.</p></div>
    </div>
    <p class="cap" data-a="rise">Test every sentence: <b>would the reader miss it if it were gone?</b></p>
  </div>
  <aside class="note">The "after" has a concrete action and a concrete result. No adjectives doing the work.</aside>
</section>

<section class="slide" data-tr="wipe" data-act="Act 01 · Quality" data-level="deep">
  <div class="in">
    <div class="eyebrow" data-a="fade">Personalisation that sticks</div>
    <h2 class="head"><span class="ln"><span>Anatomy of a <em>voice skill</em></span></span></h2>
    <div class="grid2 grow" style="grid-template-columns:860px 1fr;align-items:start">
<pre class="code" data-a="left"><span class="c">---</span>
<span class="k">name:</span> linkedin-voice
<span class="k">description:</span> <span class="s">ALWAYS use when drafting a
  LinkedIn post, repost or comment
  for me. Also on "write my take on…"</span>
<span class="c">---</span>
<span class="k">## Voice</span>
Short sentences. My opinion first.
<span class="k">## Never write</span>
<span class="x">the seven habits, word for word</span>
<span class="k">## A good result</span>
[one real post of mine, in full]
<span class="k">## If a fact is missing</span>
Leave [FACT NEEDED]. Never guess.</pre>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="card hot" data-a="rise"><h3>Description = trigger</h3><p>Claude Code and Codex read only names and descriptions until a task matches. <b>"Helps with posts" rarely fires.</b></p></div>
        <div class="card" data-a="rise"><h3>One real example</h3><p>A finished piece you are proud of beats ten adjectives about tone.</p></div>
        <div class="card" data-a="rise"><h3>A rule for gaps</h3><p>A visible placeholder costs you ten seconds. <b>A guessed fact costs trust.</b></p></div>
      </div>
    </div>
  </div>
  <aside class="note">Same structure as Microsoft's Copilot skill guide: name, description, instructions, example, what to do when information is missing. One file format, many tools.</aside>
</section>

<section class="slide" data-tr="drop" data-act="Act 01 · Quality" data-level="deep">
  <div class="in">
    <div class="eyebrow" data-a="fade">Three open skills I build on</div>
    <h2 class="head"><span class="ln"><span>Design with agents <em>in three passes</em></span></span></h2>
    <div class="grid3" style="position:relative">

    <div class="grid3 grow" style="grid-template-rows:1fr 1fr;gap:20px">
      <div class="card" data-a="rise" style="padding:22px 28px"><div class="lab">1 · A in Codex</div><p><b>Adds a filter</b>, tests, builds, pushes. Main now has commit X.</p></div>

        <div class="card hot" data-a="rise"><h3>Works everywhere</h3><p>First line of CLAUDE.md: <span class="chip">@AGENTS.md</span></p></div>
        <div class="card" data-a="rise"><h3>Moving a setup</h3><p><span class="chip">/import codex --dry-run</span> previews a one-time copy of rules, MCP, commands, subagents and skills.</p></div>
      </div>
    </div>
  </div>
  <aside class="note">Memory never moves between tools. Once a week, open /memory, keep the lessons worth keeping in AGENTS.md or context/, delete the rest. /import makes a copy, and copies drift: if both tools stay in use, keep the shared AGENTS.md.</aside>
</section>

<section class="slide" data-tr="wipe" data-act="Act 02 · Case 3" data-level="start">
  <div class="in">

    <h2 class="head"><span class="ln"><span>The <em>two-minute</em> check</span></span></h2>
    <p class="lede" data-a="fade">New session in each tool. Ask:</p>
    <div class="grid3 grow">

<section class="slide" data-tr="wipe" data-act="Act 03 · Control" data-level="start">
  <div class="in" style="gap:22px">
    <div class="eyebrow" data-a="fade">The AI Decision Matrix · ambiguity × risk</div>
    <h2 class="head" style="font-size:92px"><span class="ln"><span>Who frames, acts <em>and learns</em></span></span></h2>
    <div class="grow" style="display:grid;grid-template-columns:70px 1fr 1fr;grid-template-rows:1fr 1fr 50px;gap:16px">
      <div class="mono muted" style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:22px;letter-spacing:.14em;font-weight:700">HIGH AMBIGUITY</div>
      <div class="card" data-a="pop" style="padding:22px 28px"><h3>Exploratory</h3><p>New or unclear, learning matters more than precision. <b>Enable experiments.</b></p><p class="mono" style="font-size:22px;margin-top:auto">Frame <span class="violet">human+AI</span> · Act <span class="mint">AI</span> · Learn <span style="color:var(--ink)">human</span></p></div>
      <div class="card bad" data-a="pop" style="padding:22px 28px"><h3>Strategic</h3><p>New or unclear with organisation-wide consequences. <b>Lead with continuous oversight.</b></p><p class="mono" style="font-size:22px;margin-top:auto">Frame <span class="violet">human+AI</span> · Act <span class="violet">human+AI</span> · Learn <span style="color:var(--ink)">human</span></p></div>
      <div class="mono muted" style="writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:22px;letter-spacing:.14em;font-weight:700">LOW AMBIGUITY</div>
      <div class="card hot" data-a="pop" style="padding:22px 28px"><h3>Routine</h3><p>Well defined, limited downside if wrong. <b>Automate and monitor.</b></p><p class="mono" style="font-size:22px;margin-top:auto">Frame <span class="mint">AI</span> · Act <span class="mint">AI</span> · Learn <span class="mint">AI</span></p></div>
      <div class="card" data-a="pop" style="padding:22px 28px"><h3>Consequential</h3><p>Well defined, broad impact. <b>Manage for reliability.</b></p><p class="mono" style="font-size:22px;margin-top:auto">Frame <span class="mint">AI</span> · Act <span class="mint">AI</span> · Learn <span style="color:var(--ink)">human</span></p></div>
      <div></div>
      <div class="mono muted" style="text-align:center;font-size:22px;letter-spacing:.14em;font-weight:700;align-self:center">LOW RISK</div>
      <div class="mono muted" style="text-align:center;font-size:22px;letter-spacing:.14em;font-weight:700;align-self:center">HIGH RISK</div>
    </div>
    <div class="src" data-a="fade">Adapted from I. Sebastian, P. Weill, T. Haskamp, J. vom Brocke, "Designing Decision Rights for AI", MIT Sloan Management Review, 2026</div>
  </div>
  <aside class="note">Treating every use case as high risk stalls everything. Frame = define the decision. Act = take or recommend actions. Learn = own and improve outcomes.</aside>
</section>

<section class="slide" data-tr="wipe" data-act="Act 03 · Control" data-level="start">
  <div class="in">
    <div class="eyebrow" data-a="fade">Why Railway keeps showing up</div>
    <h2 class="head"><span class="ln"><span>Installed beats <em>chosen</em></span></span></h2>
    <div class="grid3 tight">
      <div class="card" data-a="rise"><h3>An official plugin</h3><p>In Anthropic's plugin marketplace: a skill, a hosted MCP server and hooks. The agent already knows Railway.</p></div>
      <div class="card" data-a="rise"><h3>One command, every tool</h3><p><span class="chip">railway skills install</span> writes to ~/.agents/skills and every agent folder it finds.</p></div>
      <div class="card" data-a="rise"><h3>Fits a prototype</h3><p>Backend, database and a URL from the editor. No Dockerfile, no cloud console.</p></div>
    </div>
    <div class="tbl" data-a="rise" style="grid-template-columns:520px 1fr">
      <div class="th"><span>Prototype</span><span>Options</span></div>
      <div><span class="n">One page, demo</span><span>Claude artifacts · Vercel · Netlify · Cloudflare Pages · GitHub Pages</span></div>
      <div><span class="n">Front end + data + login</span><span>Vercel or Netlify with Supabase</span></div>
      <div><span class="n">Full app with backend</span><span>Railway · Render · Fly.io · Heroku · DigitalOcean · Cloud Run</span></div>
      <div><span class="n">Client data</span><span>The client's own cloud, e.g. SAP BTP, Azure / M365</span></div>
    </div>
    <p class="cap" data-a="rise" style="font-size:32px">Write the choice in AGENTS.md, then <b>check /plugin for hosting you never picked</b></p>
  </div>
  <aside class="note">Example line for AGENTS.md: "Prototypes: static goes to Vercel, full-stack to Render, EU region. Client work: never deploy outside the client's environment." Remember: that line guides, a hook enforces.</aside>
</section>

<section class="slide" data-tr="wipe" data-act="Act 03 · Control" data-level="deep">
  <div class="in" style="gap:24px">
    <div class="eyebrow" data-a="fade">Claude Code permission modes · from the docs</div>
    <h2 class="head"><span class="ln"><span>How much <em>freedom?</em></span></span></h2>
    <div class="tbl grow" style="grid-template-columns:360px 1fr 560px;align-content:start">
      <div class="th"><span>Mode</span><span>Runs without asking</span><span>Best for</span></div>
      <div data-a="fade"><span class="n mono">default</span><span>Reads in your folders</span><span>Sensitive work, unfamiliar code</span></div>
      <div data-a="fade"><span class="n mono">acceptEdits</span><span>Reads, edits, common file commands</span><span>Iterating on code you review</span></div>
      <div data-a="fade"><span class="n mono">plan</span><span>Reads; edits wait for your approved plan</span><span>Exploring before changing</span></div>
      <div data-a="fade"><span class="n mono mint">auto</span><span>Everything, with background safety checks</span><span>Long tasks, fewer prompts</span></div>
      <div data-a="fade"><span class="n mono">dontAsk</span><span>Only pre-approved tools, the rest denied</span><span>Locked-down CI and scripts</span></div>
      <div data-a="fade"><span class="n mono red">bypassPermissions</span><span>Everything, no checks</span><span class="red">Isolated containers and VMs only</span></div>
    </div>
    <div class="card bad" data-a="slap" style="flex-direction:row;gap:24px;align-items:center;padding:20px 28px"><p style="font-size:31px;color:var(--ink)"><b>"bypassPermissions offers no protection against prompt injection or unintended actions."</b></p><span class="src" style="flex:none">Claude Code docs</span></div>
  </div>
  <aside class="note">Since v2.1.283, auto is the starting mode in the terminal and VS Code. Admins can disable bypass with permissions.disableBypassPermissionsMode in managed settings. The docs recommend bypass only in containers or VMs without internet access.</aside>
</section>

  function setBar(b,s,i){
    const l=b.querySelector('.lvl'); const lv=s.dataset.level||'none';
    l.className='lvl '+lv; l.textContent=lv==='start'?'Start here':lv==='deep'?'Go deeper':'';
    b.querySelector('.act').textContent=s.dataset.act||'';
    b.querySelector('.num').textContent=(i+1)+' / '+raw.length;
  }

  let stage, slides;
  if(print){
    document.body.classList.add('print');
    raw.forEach((s,i)=>{ const st=document.createElement('div'); st.className='stage'; const b=bar(); st.appendChild(b);
      const c=s.cloneNode(true); st.appendChild(c); setBar(b,c,i); deck.appendChild(st); stages.push(st); });
    slides=[...deck.querySelectorAll('.slide')];
  } else {
    stage=document.createElement('div'); stage.className='stage'; stage.id='stage';
    stage.appendChild(bar());
    raw.forEach(s=>stage.appendChild(s.cloneNode(true)));
    const sh=document.createElement('div'); sh.id='shutter'; sh.className='h'; sh.innerHTML='<i></i><i></i><i></i>'; stage.appendChild(sh);
    const ir=document.createElement('div'); ir.id='iris'; stage.appendChild(ir);
    deck.appendChild(stage); stages.push(stage);
    slides=[...stage.querySelectorAll('.slide')];
  }

  /* fit stage */
  function fit(){ if(print) return; const W=innerWidth,H=innerHeight,k=Math.min(W/1920,H/1080);
    stage.style.transform='translate('+((W-1920*k)/2)+'px,'+((H-1080*k)/2)+'px) scale('+k+')'; }
  addEventListener('resize',fit); fit();

  /* headline fit: shrink in 2px steps, never below 60px */
  function fitHeads(){ document.querySelectorAll('.head').forEach(h=>{ const max=+(h.dataset.fit||1728); let fs=parseFloat(getComputedStyle(h).fontSize);
    const w=()=>Math.max(0,...[...h.querySelectorAll('.ln>span')].map(x=>x.offsetWidth));
    while(w()>max && fs>60){ fs-=2; h.style.fontSize=fs+'px'; } }); }

  /* QR + results */
  function qrSvg(url){ if(typeof qrcode==='undefined') return ''; const q=qrcode(0,'M'); q.addData(url); q.make();
    return q.createSvgTag({cellSize:8,margin:0,scalable:true}); }
  document.querySelectorAll('.qr[data-poll]').forEach(el=>{
    const L=LINKS[el.dataset.poll]||{}; const lab=el.querySelector('.lab');
    el.innerHTML=''; if(lab) el.appendChild(lab);
    if(L.vote){ const b=document.createElement('div'); b.className='code-svg'; b.innerHTML=qrSvg(L.vote); el.appendChild(b);
      if(!/sli\.do/.test(L.vote)){ const u=document.createElement('div'); u.className='url'; u.textContent=L.vote.replace(/^https?:\/\//,'').replace(/\/$/,''); el.appendChild(u); } }
    else { const p=document.createElement('div'); p.className='pending'; p.textContent='Link pending'; el.appendChild(p); }
  });
  function mountResults(slide){
    slide.querySelectorAll('.results[data-results]').forEach(el=>{
      if(el.dataset.mounted) return; el.dataset.mounted=1;
      const L=LINKS[el.dataset.results]||{};
      const fb=document.createElement('div'); fb.className='fallback';
      fb.innerHTML=L.results
        ? '<a class="btn" style="font-size:44px;padding:34px 56px" target="_blank" rel="noopener" href="'+L.results+'">Show live results</a><div class="src" style="font-size:22px">Opens Slido in a new tab</div>'
        : '<div class="pending" style="width:560px;height:160px">Results link pending</div>';
      el.appendChild(fb);
    });
  }

  /* animations */
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tl=null, loops=[], cur=-1, want=0, busy=false, queued=null;
  function build(slide){
    if(typeof gsap==='undefined') return null;
    const t=gsap.timeline({paused:true});
    const lines=slide.querySelectorAll('.ln>span');
    if(lines.length) t.from(lines,{yPercent:115,duration:.8,ease:'power4.out',stagger:.12},.05);
    slide.querySelectorAll('[data-a]').forEach(el=>{
      const a=el.dataset.a, at=el.dataset.at||'-=0.5';
      if(a==='fade') t.from(el,{opacity:0,duration:.5},at);
      else if(a==='rise') t.from(el,{y:120,opacity:0,duration:.7,ease:'back.out(1.7)'},at);
      else if(a==='left') t.from(el,{x:-140,opacity:0,duration:.75,ease:'back.out(1.6)'},at);
      else if(a==='right') t.from(el,{x:140,opacity:0,duration:.75,ease:'back.out(1.6)'},at);
      else if(a==='pop') t.from(el,{scale:.6,opacity:0,transformOrigin:'50% 50%',duration:.55,ease:'back.out(2.4)'},at);
      else if(a==='slap') t.from(el,{scale:3,rotation:-12,opacity:0,duration:.45,ease:'power4.in'},el.dataset.at||'>-0.1');
      else if(a==='strike') t.fromTo(el,{'--s':0},{'--s':1,duration:.35,ease:'power2.out'},'>-0.15');
      else if(a==='draw'){ const L=el.getTotalLength(), dashed=el.classList.contains('danger');
        t.fromTo(el,{strokeDasharray:L,strokeDashoffset:L},{strokeDashoffset:0,duration:.55,ease:'power2.inOut',
          onComplete:()=>{el.style.strokeDasharray=dashed?'14 12':'';}},el.dataset.at||'>-0.1'); }
    });
    if(slide.dataset.loop==='packets') t.add(()=>startPackets(slide));
    return t;
  }
  function startPackets(slide){
    if(reduce) return;
    [['pA','wA'],['pB','wB']].forEach(([c,w],i)=>{
      const path=slide.querySelector('#'+w), dot=slide.querySelector('#'+c); if(!path||!dot) return;
      const L=path.getTotalLength(), o={v:0};
      loops.push(gsap.to(o,{v:1,duration:1.6,ease:'power1.inOut',repeat:-1,repeatDelay:.5,delay:i*.8,
        onUpdate:()=>{const p=path.getPointAtLength(o.v*L); dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y);}}));
    });
  }
  function stopLoops(){ loops.forEach(l=>l.kill()); loops=[]; document.querySelectorAll('.packet').forEach(d=>{d.setAttribute('cx',-50);d.setAttribute('cy',-50);}); }

  function enter(i){
    slides.forEach((s,k)=>s.classList.toggle('is-on',k===i));
    setBar(stage.querySelector('.bar'),slides[i],i);
    closePops();
    stopLoops(); tl&&tl.progress(1).kill();
    mountResults(slides[i]);
    tl=build(slides[i]); if(tl){ reduce?tl.progress(1):tl.restart(); }
    try{ history.replaceState(null,'','#s'+(i+1)); }catch(e){}
    renderNotes();
  }
  function go(i){
    i=Math.max(0,Math.min(slides.length-1,i)); want=i; if(i===cur&&!busy) return;
    if(busy){ queued=i; return; }
    const first=cur<0, tr=slides[i].dataset.tr||'wipe';
    cur=i;
    if(first||reduce||typeof gsap==='undefined'){ enter(i); return; }
    busy=true;
    const done=()=>{ busy=false; if(queued!==null&&queued!==cur){ const n=queued; queued=null; go(n); } else queued=null; };
    if(tr==='iris'){ const ir=stage.querySelector('#iris');
      gsap.timeline({onComplete:done}).set(ir,{scale:0,opacity:1}).to(ir,{scale:1,duration:.5,ease:'power3.in'})
        .add(()=>enter(i)).to(ir,{opacity:0,duration:.22}); }
    else { const sh=stage.querySelector('#shutter'); sh.className=tr==='drop'?'v':'h'; const bars=sh.querySelectorAll('i'); const prop=tr==='drop'?'scaleY':'scaleX';
      gsap.timeline({onComplete:done}).set(bars,{[prop]:0,transformOrigin:tr==='drop'?'50% 0%':'0% 50%'})
        .to(bars,{[prop]:1,duration:.3,ease:'power3.inOut',stagger:.055}).add(()=>enter(i))
        .set(bars,{transformOrigin:tr==='drop'?'50% 100%':'100% 50%'}).to(bars,{[prop]:0,duration:.3,ease:'power3.inOut',stagger:{each:.055,from:'end'}}); }
  }

  /* repo map popovers */
  function closePops(){ document.querySelectorAll('.pop.on,.node.on').forEach(e=>e.classList.remove('on')); }
  function openPop(node){ const id=node.dataset.pop, p=node.closest('.slide').querySelector('#'+id); const was=p.classList.contains('on');
    closePops(); if(!was){ p.classList.add('on'); node.classList.add('on'); if(typeof gsap!=='undefined') gsap.from(p,{y:30,opacity:0,duration:.35,ease:'back.out(2)'}); } }
  document.addEventListener('click',e=>{
    const n=e.target.closest('.node'); if(n){ e.stopPropagation(); openPop(n); return; }
    const g=e.target.closest('[data-goto]'); if(g){ e.preventDefault(); go(+g.dataset.goto-1); return; }
    if(e.target.closest('[data-fs]')){ toggleFs(); return; }
    if(e.target.closest('a,button,.pop,iframe,#notes')) return;
    if(print||!stage) return;
    const r=stage.getBoundingClientRect(); if(e.clientX<r.left+r.width/4) go(want-1); else go(want+1);
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('node')) openPop(e.target); });

  /* notes, jump, theme, fullscreen */
  let notesOn=false; let nb=null;
  function renderNotes(){ if(!notesOn){ nb&&nb.remove(); nb=null; return; }
    if(!nb){ nb=document.createElement('div'); nb.id='notes'; document.body.appendChild(nb); }
    const n=slides[cur].querySelector('.note'); nb.innerHTML='<b>Notes · slide '+(cur+1)+'</b><br>'+(n?n.innerHTML:'—'); }
  function toggleFs(){ const d=document.documentElement; try{ if(!document.fullscreenElement) d.requestFullscreen&&d.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }catch(e){} }
  let typed='', jb=null;
  document.addEventListener('keydown',e=>{
    if(print) return;
    const k=e.key;
    if(/^[0-9]$/.test(k)){
      typed+=k; if(!jb){ jb=document.createElement('div'); jb.id='jump'; document.body.appendChild(jb); } jb.textContent='→ '+typed; return; }
    if(k==='Enter'&&typed){ go(+typed-1); typed=''; jb&&jb.remove(); jb=null; return; }
    if(k==='Escape'){ typed=''; jb&&jb.remove(); jb=null; closePops(); return; }
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ e.preventDefault(); go(want+1); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(want-1); }
    else if(k==='Home') go(0); else if(k==='End') go(slides.length-1);
    else if(k==='f'||k==='F'||k==='а'||k==='А') toggleFs();
    else if(k==='r'||k==='R'||k==='к'||k==='К'){ const i=cur; stopLoops(); tl&&tl.kill(); tl=build(slides[i]); tl&&tl.restart(); }
    else if(k==='n'||k==='N'||k==='т'||k==='Т'){ notesOn=!notesOn; renderNotes(); }
    else if(k==='t'||k==='T'||k==='е'||k==='Е'){ const r=document.documentElement, c=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'); r.setAttribute('data-theme',c==='dark'?'light':'dark'); }
  });

  /* start */
  const startAt=()=>{ const m=location.hash.match(/^#s(\d+)$/); return m?Math.max(0,+m[1]-1):0; };
  document.fonts.ready.then(()=>{
    if(print){ slides.forEach(s=>s.classList.add('is-on')); fitHeads(); slides.forEach(s=>mountResults(s)); document.body.dataset.ready=1; return; }
    slides.forEach(s=>s.classList.add('is-on')); fitHeads(); slides.forEach(s=>s.classList.remove('is-on'));
    go(startAt());
  });
  addEventListener('hashchange',()=>{ const i=startAt(); if(i!==cur) go(i); });
})();
</script>
